name: paper-hourly
on:
  schedule:
    - cron: '7 * * * *'      # every hour at minute 07 UTC (GitHub may delay it; the engine catches up missed hours)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: paper-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas requests
      - uses: actions/cache@v4
        with:
          path: .cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: Run paper engine (public Hyperliquid data only; no orders, no keys)
        run: python engine/run_all.py
      - name: Guard
        run: python engine/guard.py
      - name: Commit and push
        run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          : > .nojekyll
          git add data index.html backtest.html robots.txt .nojekyll
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "paper run $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((10*i)); done
      - name: Trigger Pages build
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
        env:
          GH_TOKEN: ${{ github.token }}
