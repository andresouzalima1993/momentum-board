name: donchian-selftest
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selftest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas requests
      - uses: actions/cache@v4
        with:
          path: .cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: Donchian daily step, dry run (cold-cache timing test, writes nothing to the repo)
        run: |
          mkdir -p /tmp/dn_selftest
          time python engine/dn_run.py --state-dir /tmp/dn_selftest --cache-dir .cache/candles_1d --history-days 500 --start-date 2026-11-26 --capital 5000 --dry-run | tail -8
