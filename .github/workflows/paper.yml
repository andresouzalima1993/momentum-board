name: paper-hourly
# Watchdog. Runs on the hourly cron (GitHub may delay or skip it; that is fine). It never touches the data:
# it only checks whether a paper-loop run is active or queued, and starts one if the chain died.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restart the loop if it is not running
        run: |
          n=$(gh run list --repo "${{ github.repository }}" --workflow paper-loop --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          echo "active or queued paper-loop runs: $n"
          if [ "$n" = "0" ]; then gh workflow run paper-loop --repo "${{ github.repository }}" -f loop_minutes=325 --ref main && echo "loop restarted"; fi
